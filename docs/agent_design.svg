<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 516" width="760" height="516" font-family="Helvetica, Arial, sans-serif">
  <rect width="760" height="516" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="26" font-size="12" fill="#0f6e56" font-weight="bold">code — no tokens</text>
  <line x1="40" y1="34" x2="300" y2="34" stroke="#0f6e56" stroke-width="1"/>
  <text x="320" y="26" font-size="12" fill="#185fa5" font-weight="bold">model — four calls per company</text>
  <line x1="320" y1="34" x2="580" y2="34" stroke="#185fa5" stroke-width="1"/>

  <g>
    <rect x="40" y="66" width="128" height="46" rx="6" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.75"/>
    <text x="104" y="94" font-size="12" fill="#04342c" text-anchor="middle">route</text>
    <rect x="192" y="66" width="360" height="46" rx="6" fill="#ffffff" stroke="#0f6e56" stroke-width="0.75"/>
    <text x="208" y="86" font-size="13" fill="#111827" font-weight="bold">1. Route each point to its source</text>
    <text x="208" y="102" font-size="11.5" fill="#4b5563">P1 and P5 read the database, P4 can only be answered by people</text>
  </g>

  <g>
    <rect x="40" y="136" width="128" height="46" rx="6" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.75"/>
    <text x="104" y="164" font-size="12" fill="#04342c" text-anchor="middle">tools</text>
    <rect x="192" y="136" width="360" height="46" rx="6" fill="#ffffff" stroke="#0f6e56" stroke-width="0.75"/>
    <text x="208" y="156" font-size="13" fill="#111827" font-weight="bold">2. Gather the evidence</text>
    <text x="208" y="172" font-size="11.5" fill="#4b5563">3 SQL aggregates, 2 interviews, the annual letter</text>
  </g>

  <g>
    <rect x="40" y="206" width="128" height="46" rx="6" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.75"/>
    <text x="104" y="234" font-size="12" fill="#04342c" text-anchor="middle">python</text>
    <rect x="192" y="206" width="360" height="46" rx="6" fill="#ffffff" stroke="#0f6e56" stroke-width="0.75"/>
    <text x="208" y="226" font-size="13" fill="#111827" font-weight="bold">3. Do the arithmetic</text>
    <text x="208" y="242" font-size="11.5" fill="#4b5563">growth, operating margin, distance to the industry median</text>
  </g>

  <g>
    <rect x="40" y="276" width="128" height="46" rx="6" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.75"/>
    <text x="104" y="304" font-size="12" fill="#042c53" text-anchor="middle">python + model</text>
    <rect x="192" y="276" width="360" height="46" rx="6" fill="#ffffff" stroke="#185fa5" stroke-width="0.75"/>
    <text x="208" y="296" font-size="13" fill="#111827" font-weight="bold">4. Decide</text>
    <text x="208" y="312" font-size="11.5" fill="#4b5563">P1 and P5 by threshold in code; P4 by the model reading two quotes</text>
  </g>

  <g>
    <rect x="40" y="346" width="128" height="46" rx="6" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.75"/>
    <text x="104" y="374" font-size="12" fill="#042c53" text-anchor="middle">model</text>
    <rect x="192" y="346" width="360" height="46" rx="6" fill="#ffffff" stroke="#185fa5" stroke-width="0.75"/>
    <text x="208" y="366" font-size="13" fill="#111827" font-weight="bold">5. Review</text>
    <text x="208" y="382" font-size="11.5" fill="#4b5563">a second call that may send P4 back for one more look</text>
  </g>

  <g>
    <rect x="40" y="416" width="128" height="46" rx="6" fill="#e6f1fb" stroke="#185fa5" stroke-width="0.75"/>
    <text x="104" y="444" font-size="12" fill="#042c53" text-anchor="middle">model</text>
    <rect x="192" y="416" width="360" height="46" rx="6" fill="#ffffff" stroke="#185fa5" stroke-width="0.75"/>
    <text x="208" y="436" font-size="13" fill="#111827" font-weight="bold">6. Write the summary</text>
    <text x="208" y="452" font-size="11.5" fill="#4b5563">any number that is not on the fact sheet is rejected</text>
  </g>

  <line x1="156" y1="89" x2="186" y2="89" stroke="#6b7280" stroke-width="1.25" marker-end="url(#a)"/>
  <line x1="156" y1="159" x2="186" y2="159" stroke="#6b7280" stroke-width="1.25" marker-end="url(#a)"/>
  <line x1="156" y1="229" x2="186" y2="229" stroke="#6b7280" stroke-width="1.25" marker-end="url(#a)"/>
  <line x1="156" y1="299" x2="186" y2="299" stroke="#6b7280" stroke-width="1.25" marker-end="url(#a)"/>
  <line x1="156" y1="369" x2="186" y2="369" stroke="#6b7280" stroke-width="1.25" marker-end="url(#a)"/>
  <line x1="156" y1="439" x2="186" y2="439" stroke="#6b7280" stroke-width="1.25" marker-end="url(#a)"/>

  <line x1="372" y1="112" x2="372" y2="132" stroke="#6b7280" stroke-width="1.25" marker-end="url(#a)"/>
  <line x1="372" y1="182" x2="372" y2="202" stroke="#6b7280" stroke-width="1.25" marker-end="url(#a)"/>
  <line x1="372" y1="252" x2="372" y2="272" stroke="#6b7280" stroke-width="1.25" marker-end="url(#a)"/>
  <line x1="372" y1="322" x2="372" y2="342" stroke="#6b7280" stroke-width="1.25" marker-end="url(#a)"/>
  <line x1="372" y1="392" x2="372" y2="412" stroke="#6b7280" stroke-width="1.25" marker-end="url(#a)"/>

  <text x="572" y="86" font-size="11" fill="#6b7280">3 SQL queries per company</text>
  <text x="572" y="156" font-size="11" fill="#6b7280">2 of 10 interviews</text>
  <text x="572" y="226" font-size="11" fill="#6b7280">no model arithmetic</text>
  <text x="572" y="296" font-size="11" fill="#6b7280">60 verdicts</text>
  <text x="572" y="366" font-size="11" fill="#6b7280">no disagreement on public</text>
  <text x="572" y="436" font-size="11" fill="#6b7280">results.csv</text>
</svg>
